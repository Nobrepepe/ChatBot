appId: dev.nobrepepe.character-chat
productName: Character Chat
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
linux:
  target:
    - AppImage
  category: Utility
  # The same SVG the desktop-entry installer uses; electron-builder rasterises it.
  icon: packaging/character-chat.svg
  syncDesktopName: true
win:
  target:
    - nsis
mac:
  target:
    - dmg
npmRebuild: true
